org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable all native builds to avoid CMake issues
android.defaults.buildfeatures.nativebuild=false
android.enableCMake=false
android.enableNativeBuild=false

# Additional CMake disabling properties
android.externalNativeBuild.cmake.abiFilters=
android.externalNativeBuild.ndkBuild.abiFilters=

# Force disable native build features
android.buildFeatures.externalNativeBuild=false
